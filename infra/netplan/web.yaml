# /etc/netplan/50-cloud-init.yaml trên VM web — đổi ens32 theo tên card (ip a)
# Áp dụng: sudo chmod 600 /etc/netplan/50-cloud-init.yaml && sudo netplan apply
network:
  version: 2
  ethernets:
    ens32:
      addresses: [192.168.100.20/24]
      routes: [{to: default, via: 192.168.100.2}]
      nameservers: {addresses: [192.168.100.2, 8.8.8.8]}
